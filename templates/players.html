{% extends "layout.html" %}
{% block content %}
<section class="panel">
  <h2>Players</h2>
  <p>Player management is admin-only. Anyone can still record games from the Games page.</p>
</section>

<section class="panel">
  <h3>Current Players</h3>
  <ul>
    {% for player in players %}
      <li><a href="{{ url_for('player_profile', player_id=player.id) }}" class="player-link">{{ player.name }}</a></li>
    {% else %}
      <li>No players added yet.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
